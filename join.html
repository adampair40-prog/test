<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c16">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="You’ve been invited to a Krypt community — private chat, voice and screen sharing between friends.">
  <title>You’re invited — Krypt</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="assets/fonts/Inter-Regular.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="preload" href="assets/fonts/Inter-SemiBold.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="css/krypt.css">
  <style>
    body { overflow: auto; background: var(--well); }
    .join { position: relative; min-height: 100dvh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    .join::before { content: ''; position: absolute; inset: -10% -10% auto; height: 80%; pointer-events: none;
      background: radial-gradient(closest-side at 42% 50%, rgb(var(--accent-rgb) / .13), transparent), radial-gradient(closest-side at 62% 58%, color-mix(in srgb, var(--presence) 10%, transparent), transparent); }
    .join > * { position: relative; }
    .join-top { display: flex; align-items: center; gap: 10px; height: 64px; padding: 0 20px 0 24px; }
    .join-top .brand { width: 28px; height: 28px; }
    .join-top .brand path:nth-of-type(2) { stroke: var(--well); }
    .join-top b { font-size: 18px; font-weight: 600; letter-spacing: -.015em; }
    .join-top a { margin-left: auto; }
    .join-main { display: grid; place-items: center; align-content: center; padding: 16px 16px 48px; }
    .join-main > div { width: min(460px, 100%); }
    .invite { width: 100%; padding: 32px 28px 24px; border-radius: 20px; text-align: center; background: color-mix(in srgb, var(--bg) 90%, transparent); border: 1px solid var(--line-2); box-shadow: var(--shadow-modal); backdrop-filter: blur(18px); animation: modal-in 420ms var(--ease-out); }
    .invite .ctile-lg { width: 80px; height: 80px; margin: 0 auto 18px; border-radius: 22px; overflow: hidden; box-shadow: 0 0 0 4px var(--bg), 0 14px 32px -12px rgb(0 0 0 / .6); }
    .invite .ctile-lg svg { width: 100%; height: 100%; display: block; }
    .invite .kicker { display: block; font-size: 13px; font-weight: 500; color: var(--text-2); }
    .invite h1 { margin: 4px 0 8px; font-size: 30px; font-weight: 600; letter-spacing: -.025em; line-height: 1.15; }
    .invite .meta { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 8px; font-size: 13px; color: var(--text-2); }
    .invite .meta span { display: inline-flex; align-items: center; gap: 6px; }
    .invite .meta span + span::before { content: '·'; margin-right: 2px; color: var(--text-3); }
    .invite .meta i { width: 8px; height: 8px; border-radius: 50%; background: var(--presence); }
    .invite .who { --ring: var(--bg); display: flex; justify-content: center; margin: 22px 0 8px; }
    .invite .who .avatar { margin: 0 -5px; box-shadow: 0 0 0 3px var(--bg); }
    .invite .who-note { margin: 0 0 24px; font-size: 13px; color: var(--text-3); }
    .invite form { display: grid; gap: 8px; text-align: left; }
    .invite label { font-size: 13px; font-weight: 500; color: var(--text-2); }
    .invite .input { height: 44px; font-size: 15px; border-radius: var(--r-lg); }
    .invite .btn.lg { width: 100%; margin-top: 6px; }
    .invite .alt { margin: 16px 0 0; font-size: 13px; color: var(--text-3); }
    .invite .alt a { font-weight: 500; }
    .facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 16px; }
    .facts div { padding: 12px; border-radius: var(--r-lg); background: color-mix(in srgb, var(--bg) 72%, transparent); border: 1px solid var(--line); font-size: 12px; line-height: 1.45; color: var(--text-3); }
    .facts .i { display: block; margin-bottom: 8px; color: var(--accent-text); }
    .facts b { display: block; margin-bottom: 2px; font-size: 13px; font-weight: 600; color: var(--text); }
    .join-foot { padding: 16px 24px 24px; text-align: center; font-size: 12px; color: var(--text-3); }
    .done { display: none; }
    .invite.accepted form, .invite.accepted .alt { display: none; }
    .invite.accepted .done { display: block; animation: view-in var(--t-slow) var(--ease-out); }
    .done .check { width: 56px; height: 56px; margin: 4px auto 14px; border-radius: 50%; display: grid; place-items: center; background: color-mix(in srgb, var(--success) 16%, transparent); color: var(--success); animation: pop 420ms var(--spring); }
    .done .check .i { width: 28px; height: 28px; }
    .done h2 { margin: 0 0 6px; font-size: 21px; font-weight: 600; letter-spacing: -.015em; }
    .done p { margin: 0 0 18px; font-size: 14px; color: var(--text-2); }
    @media (max-width: 520px) {
      .join-top { padding: 0 12px 0 16px; }
      .invite { padding: 28px 20px 20px; border-radius: 18px; }
      .invite h1 { font-size: 26px; }
      .facts { grid-template-columns: 1fr; }
      .facts div { display: grid; grid-template-columns: 20px 1fr; column-gap: 12px; }
      .facts .i { grid-row: span 2; margin: 1px 0 0; }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px;font-family:system-ui">Krypt Web needs JavaScript to run.</p></noscript>
  <script type="module">
    import { buildPalette, applyPalette } from './js/theme.js';
    import { icon, brandMark } from './js/icons.js';
    import { critter, communityTile } from './js/art.js';
    import * as D from './js/data.js';

    let theme = { preset: 'fern', custom: null, accent: null, mode: 'dark' };
    try { theme = { ...theme, ...JSON.parse(localStorage.getItem('krypt-web:theme') || '{}') }; } catch { /* private mode */ }
    const light = theme.mode === 'light' || (theme.mode === 'system' && matchMedia('(prefers-color-scheme: light)').matches);
    applyPalette(buildPalette({ preset: theme.preset, custom: theme.custom, accent: theme.accent, light }), light);

    const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const id = (location.hash.slice(1).split('-')[0]) || 'server';
    const c = D.communities.find((x) => x.id === id) || D.communities[0];
    const members = c.members.filter((m) => m !== 'me');
    const online = members.filter((m) => D.people[m].status !== 'offline');
    const host = D.people[D.rooms[c.rooms[0]].owner];
    document.title = `Join ${c.name} — Krypt`;

    const root = document.createElement('div');
    document.body.append(root);
    root.innerHTML = `<div class="join">
      <header class="join-top">${brandMark(28)}<b>Krypt</b><a class="btn sm" href="index.html">Open Krypt</a></header>
      <main class="join-main"><div>
        <section class="invite" id="invite" aria-labelledby="joinTitle">
          <div class="ctile-lg">${communityTile(c.id + 'join', c.hue)}</div>
          <small class="kicker">${esc(host.name)} invited you to join</small>
          <h1 id="joinTitle">${esc(c.name)}</h1>
          <div class="meta"><span><i></i>${online.length} online</span><span>${c.members.length} members</span><span>${c.rooms.length} rooms</span></div>
          <div class="who">${online.slice(0, 5).map((m) => `<span class="avatar md" title="${esc(D.people[m].name)}">${critter(m + D.people[m].name, D.people[m].hue)}</span>`).join('')}</div>
          <p class="who-note">${online.slice(0, 2).map((m) => esc(D.people[m].name)).join(', ')}${online.length > 2 ? ` and ${online.length - 2} others are around` : ' are around'}</p>
          <form id="joinForm" novalidate>
            <label for="displayName">What should people call you?</label>
            <input class="input" id="displayName" placeholder="Display name" autocomplete="nickname" maxlength="32" required>
            <button class="btn primary lg" type="submit">${icon('arrowRight', 'sm')}Accept invite</button>
          </form>
          <p class="alt">Already use Krypt? <a href="index.html">Link this browser to your account</a></p>
          <div class="done" role="status"><div class="check">${icon('check')}</div><h2>You’re in</h2><p id="doneText"></p><a class="btn primary lg" href="index.html">${icon('message', 'sm')}Go to ${esc(c.name)}</a></div>
        </section>
        <div class="facts">
          <div>${icon('lock', 'sm')}<b>Encrypted</b>Messages and calls are end to end.</div>
          <div>${icon('key', 'sm')}<b>Your keys</b>Made on this device. Never uploaded.</div>
          <div>${icon('monitorUp', 'sm')}<b>Full speed</b>Share screens at up to 1440p60.</div>
        </div>
      </div></main>
      <footer class="join-foot">This is a design preview — nothing you type leaves this page.</footer>
    </div>`;

    const form = document.getElementById('joinForm');
    const input = document.getElementById('displayName');
    input.focus();
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = input.value.trim();
      if (!name) { input.focus(); input.classList.add('invalid'); input.placeholder = 'Pick a name first'; return; }
      document.getElementById('doneText').textContent = `Welcome, ${name}. A key for this browser was created and ${c.name} knows you’re coming.`;
      document.getElementById('invite').classList.add('accepted');
    });
    input.addEventListener('input', () => input.classList.remove('invalid'));
  </script>
</body>
</html>
